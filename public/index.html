<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz użytkownika</title>
</head>
<body>
    <h1>Dodaj użytkownika</h1>

    <form action="/contact" method="POST">
        <label>Imię:</label>
        <input type="text" name="name" required>

        <label>Email:</label>
        <input type="email" name="email" required>

        <button type="submit">Wyślij</button>
    </form>
</body>
</html>
